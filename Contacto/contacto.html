<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
<h1>Contacto</h1>
<img src="contacto.jpeg" alt="Imagen de contacto" width="150" height="100">
<p>Si tienes alguna pregunta o comentario, no dudes en contactarme a través del siguiente formulario:</p>
<form action="enviar_contacto.php" method="post">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required><br><br>
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="mensaje">Mensaje:</label><br>
    <textarea id="mensaje" name="mensaje" rows="5" cols="30" required></textarea><br><br>
    <input type="submit" value="Enviar">
</form>
</body>
</html>
